---
layout: default
---
<main id="contenido" class="article-page">
  <article class="article">
    <header class="article-heading">
      <div class="article-heading-inner">
        <h1 class="article-title">{{ page.title | escape }}</h1>
        <time class="article-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%d.%m.%Y' }}</time>
      </div>
    </header>
    <div class="article-sheet">
      <div class="article-body prose" lang="{{ page.lang | default: site.lang }}">
        {{ content }}
      </div>
    </div>
  </article>
</main>
