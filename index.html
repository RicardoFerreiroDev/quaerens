---
layout: default
kind: home
---
<main id="contenido" class="home-main">
  <section class="home-hero" aria-labelledby="titulo-portada">
    <div class="home-hero-photo" role="img" aria-label="Fotografía submarina con un buceador a la izquierda y rayos de luz entrando en el océano"></div>
    <div class="home-hero-shade" aria-hidden="true"></div>

    <div class="home-content">
      <div class="home-identity">
        <p class="home-kicker">UN ARCHIVO DE ENSAYOS, IDEAS Y CREACIONES</p>
        <div class="home-wordmark">
          <!-- Logo original del usuario: pulpo y palabra integrados, sin duplicar con CSS. -->
          <img class="home-custom-logo" src="{{ '/assets/images/quaerens-logo.png' | relative_url }}"
               alt="" width="2048" height="682" fetchpriority="high">
          <h1 id="titulo-portada" class="visually-hidden">{{ site.title | escape }}</h1>
        </div>
        <a class="home-scroll" href="#explorar">Descender al archivo <span aria-hidden="true">↓</span></a>
      </div>
    </div>
  </section>

  <section class="home-explore" id="explorar" aria-labelledby="explorar-titulo">
    <div class="home-explore-inner">
      <h2 id="explorar-titulo">El descenso comienza<br>con una pregunta.</h2>
      <nav class="home-entrances" aria-label="Explorar el archivo">
        <a href="{{ '/filosofia/' | relative_url }}"><span class="section-numeral">I.</span><span>Filosofía</span><span aria-hidden="true">↗</span></a>
        <a href="{{ '/ia/' | relative_url }}"><span class="section-numeral">II.</span><span>Inteligencia artificial</span><span aria-hidden="true">↗</span></a>
        <a href="{{ '/fragmentos/' | relative_url }}"><span class="section-numeral">III.</span><span>Fragmentos</span><span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </section>
</main>
